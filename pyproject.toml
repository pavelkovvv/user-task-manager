[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests", "alembic"]

exclude = [
    ".venv",
    ".git",
    "__pycache__",
    ".pytest_cache",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["src", "settings", "logs"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true
