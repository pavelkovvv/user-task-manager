name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: user-task-manager-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d user-task-manager-test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB_HOST: localhost
      POSTGRES_DB_PORT: 5432
      POSTGRES_DB_USER: postgres
      POSTGRES_DB_PASSWORD: postgres
      POSTGRES_DB_NAME: user-task-manager
      POSTGRES_TEST_DB_NAME: user-task-manager-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations to test database
        run: alembic upgrade head
        env:
          POSTGRES_DB_NAME: user-task-manager-test

      - name: Lint
        run: |
          ruff check src tests main.py settings.py logs.py alembic
          ruff format --check src tests main.py settings.py logs.py alembic
          mypy src main.py settings.py logs.py tests

      - name: Run tests
        run: pytest tests/ -v
