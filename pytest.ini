[pytest]
minversion = 9.0
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
norecursedirs = .git .venv __pycache__ .pytest_cache
addopts =
    -ra
    --strict-config
    --strict-markers
    --tb=short
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:pkg_resources.*
