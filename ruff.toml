target-version = "py313"
line-length = 120
src = ["src", "alembic"]

exclude = [
    ".venv",
    ".git",
    "__pycache__",
    ".pytest_cache",
    "alembic/versions",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "B008",  # Depends() in FastAPI argument defaults
]

[lint.isort]
known-first-party = ["src", "settings", "logs"]

[format]
quote-style = "double"
indent-style = "space"
